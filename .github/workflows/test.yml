name: Test

on: [push]

env:
  FORCE_COLOR: 1

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-24.04]
        include:
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libattr1-dev libfuse3-dev fuse3 pkg-config gcc

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install --cask macfuse
          brew install pkg-config

      - name: Build
        run: uv sync --locked

      - name: Run all tests
        if: runner.os != 'macOS'
        run: uv run pytest -v -rs test/

      - name: Run limited tests (macOS)
        # on Github's macOS runner, the macFUSE kernel extension is not loaded,
        # so we only run tests that do not need to mount a FUSE fs.
        if: runner.os == 'macOS'
        run: uv run pytest -v -rs -k "test_api or test_rounding" test/

      - name: Build docs
        if: runner.os == 'Linux'
        run: uv run sphinx-build -b html rst doc/html
